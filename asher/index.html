<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Asher's site has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://evaholtz.github.io/asher-site/">
<meta http-equiv="refresh" content="0; url=https://evaholtz.github.io/asher-site/">
<script>
(function () {
  var base = "https://evaholtz.github.io/asher-site/";
  var m = location.pathname.match(/^\/asher(?:\/(.*))?$/);
  var rest = (m && m[1]) ? m[1] : "";
  if (rest === "index.html") rest = "";
  location.replace(base + rest + location.search + location.hash);
})();
</script>
</head>
<body>
<p><a href="https://evaholtz.github.io/asher-site/">Go to Asher's site</a></p>
</body>
</html>
